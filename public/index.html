<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat WebSocket - EPN FIS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- ============================================
         PANTALLA DE LOGIN / REGISTRO (Autenticación con JWT)
         ============================================ -->
    <div id="login-screen" class="login-screen">
        <div class="login-card">
            <div class="login-logo">EPN FIS</div>
            <h2>Chat WebSocket</h2>
            <p class="login-subtitle">Autenticación requerida</p>

            <!-- Toggle entre login y registro -->
            <div class="auth-tabs">
                <button id="tab-login" class="auth-tab active" data-mode="login">Iniciar sesión</button>
                <button id="tab-register" class="auth-tab" data-mode="register">Registrarse</button>
            </div>

            <!-- Formulario de Login -->
            <form id="login-form" class="login-form auth-form active">
                <input
                    type="text"
                    id="login-username"
                    placeholder="Usuario"
                    maxlength="20"
                    autocomplete="username"
                    required
                >
                <input
                    type="password"
                    id="login-password"
                    placeholder="Contraseña"
                    autocomplete="current-password"
                    required
                >
                <button type="submit" class="btn-join">Entrar</button>
                <div id="login-error" class="auth-error hidden"></div>
            </form>

            <!-- Formulario de Registro -->
            <form id="register-form" class="login-form auth-form hidden">
                <input
                    type="text"
                    id="register-username"
                    placeholder="Nuevo usuario (mín. 3 caracteres)"
                    maxlength="20"
                    autocomplete="username"
                    required
                >
                <input
                    type="password"
                    id="register-password"
                    placeholder="Contraseña (mín. 6 caracteres)"
                    autocomplete="new-password"
                    required
                >
                <button type="submit" class="btn-join">Crear cuenta</button>
                <div id="register-error" class="auth-error hidden"></div>
            </form>
        </div>
    </div>

    <!-- ============================================
         PANTALLA DEL CHAT
         ============================================ -->
    <div id="chat-screen" class="chat-screen hidden">
        <!-- Header -->
        <header class="chat-header">
            <div class="header-left">
                <h1 class="chat-title">Chat WebSocket</h1>
                <span id="user-count" class="user-count">1 usuario</span>
            </div>
            <div class="header-right">
                <span id="connection-status" class="status-indicator status-disconnected">
                    <span class="status-dot"></span>
                    <span class="status-text">Desconectado</span>
                </span>
                <button id="theme-toggle" class="theme-toggle" title="Cambiar tema">
                    <span class="theme-icon-light">🌙</span>
                    <span class="theme-icon-dark">☀️</span>
                </button>
                <button id="logout-btn" class="logout-btn" title="Cerrar sesión">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Área de mensajes -->
        <main id="messages" class="messages-area">
        </main>

        <!-- Indicador "escribiendo..." -->
        <div id="typing-indicator" class="typing-indicator hidden">
            <span class="typing-dots">
                <span></span><span></span><span></span>
            </span>
            <span id="typing-text"></span>
        </div>

        <!-- Área de input -->
        <footer class="chat-input-area">
            <input
                type="text"
                id="messageInput"
                placeholder="Escribe tu mensaje..."
                maxlength="500"
                autocomplete="off"
            >
            <button id="sendBtn" class="btn-send" title="Enviar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
                </svg>
            </button>
        </footer>
    </div>

    <script src="chat.js"></script>
</body>
</html>
